<style>
:root{--bg:#0a0d12;--s1:#11161d;--s2:#171e28;--line:#232c3a;--text:#eaf0f7;--muted:#8b98aa;--accent:#5a94ff;--accent2:#2f6df0;--hit:#34d399;--miss:#f87171;--amber:#f5b83d;--r:14px;color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
.num,.tile b,td.n,.stat{font-variant-numeric:tabular-nums}
header.top{position:sticky;top:0;z-index:20;background:#0a0d12;border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-left)) 10px max(16px,env(safe-area-inset-left))}
.top-in{max-width:980px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:10px;color:var(--text);font-weight:800;font-size:21px;letter-spacing:-.03em}
.brand:hover{text-decoration:none}.brand b{color:var(--accent);font-weight:800}
.brand svg{width:30px;height:30px;flex:none}
nav.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(6,1fr);background:rgba(17,22,29,.96);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav.tabbar a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;color:var(--muted);font-size:11px;font-weight:600;border-radius:10px;min-height:48px}
nav.tabbar a svg{width:22px;height:22px}nav.tabbar a.on{color:var(--text)}nav.tabbar a.on svg{color:var(--accent)}nav.tabbar a:hover{text-decoration:none}nav.tabbar .f{display:none}
@media(min-width:860px){nav.tabbar .f{display:inline}nav.tabbar .s{display:none}nav.tabbar{position:static;display:flex;gap:4px;background:none;border:0;padding:0;-webkit-backdrop-filter:none;backdrop-filter:none}nav.tabbar a{flex-direction:row;gap:7px;font-size:14px;padding:8px 14px;min-height:0}nav.tabbar a.on{background:var(--s2)}body{padding-bottom:40px}.top-in{flex-wrap:nowrap}}
main{max-width:980px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-left)) 8px max(16px,env(safe-area-inset-left))}
h1{font-size:28px;line-height:1.15;letter-spacing:-.03em;margin:0 0 8px;font-weight:800;text-wrap:balance}
h2{font-size:19px;letter-spacing:-.02em;margin:0 0 10px;font-weight:700}h3{font-size:15px;margin:0 0 8px;font-weight:700}
p{margin:0 0 10px}.muted{color:var(--muted)}.small{font-size:13px}.xs{font-size:12px}
.sec{margin:26px 0 0}.sec>h2{display:flex;justify-content:space-between;align-items:baseline}.sec>h2 a{font-size:14px;font-weight:600}
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card+.card{margin-top:12px}.flat{background:none;border:0;padding:0}
.hero{padding:22px 0 6px}.hero p{color:var(--muted);font-size:17px;max-width:34em}
.search{position:relative;margin-top:16px}
.search .box{display:flex;align-items:center;gap:10px;background:var(--s2);border:1px solid var(--line);border-radius:16px;padding:0 8px 0 14px;height:56px}
.search .box:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(90,148,255,.18)}
.search svg{width:20px;height:20px;color:var(--muted);flex:none}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;font-size:17px;height:100%}
.search input::placeholder{color:#66748a}
.go{background:var(--accent2);color:#fff;border-radius:11px;height:40px;padding:0 16px;font-weight:700}
.suggest{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:15;background:var(--s2);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 14px 34px rgba(0,0,0,.5)}
.suggest a,.suggest .empty{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 14px;color:var(--text);border-top:1px solid var(--line)}
.suggest a:first-child,.suggest .empty:first-child{border-top:0}.suggest a:hover,.suggest a.hl{background:#1d2633;text-decoration:none}
.suggest small{color:var(--muted);font-size:13px}.suggest .t{font-weight:600}
.badge{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 8px;white-space:nowrap}
.tiles2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
@media(min-width:700px){.tiles2{grid-template-columns:repeat(4,1fr)}}
.tool{display:block;background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:14px;color:var(--text);min-height:104px}
.tool:hover{text-decoration:none;border-color:#33425a}.tool svg{width:24px;height:24px;color:var(--accent);margin-bottom:8px}.tool b{display:block;font-size:16px}.tool span{color:var(--muted);font-size:13px}
.banner{border:1px solid var(--line);border-left:3px solid var(--amber);background:var(--s1);border-radius:12px;padding:12px 14px;font-size:14px;color:#d7deea}
.banner.info{border-left-color:var(--accent)}.banner.bad{border-left-color:var(--miss)}.banner b{color:var(--text)}
.banner+.banner,.banner+.card,.card+.banner{margin-top:12px}
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-top:1px solid var(--line);color:var(--text)}
.row:first-child{border-top:0}a.row:hover{text-decoration:none;background:#141a23}
.row .l{min-width:0}.row .l b{display:block;font-weight:600;overflow-wrap:anywhere}.row .l span{color:var(--muted);font-size:13px}
.row .r{text-align:right;flex:none;color:var(--muted);font-size:13px}
.chev{width:16px;height:16px;color:#5b687c;flex:none}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--s1);color:var(--muted);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600;min-height:38px}
.chip.on{background:var(--text);border-color:var(--text);color:#0a0d12}
.seg{display:inline-flex;background:var(--s2);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px;max-width:100%}
.seg button{padding:8px 13px;border-radius:8px;color:var(--muted);font-size:14px;font-weight:600;min-height:36px;white-space:nowrap}
.seg button.on{background:#2a3547;color:var(--text)}
.field{display:flex;flex-direction:column;gap:6px}.field>label,.lab{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.ctl{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:14px 12px;align-items:end}
.in,select.in{width:100%;background:var(--s2);border:1px solid var(--line);border-radius:11px;padding:0 12px;height:44px;font-size:16px;outline:0}
.in:focus{border-color:var(--accent)}
.stepper{display:flex;align-items:center;background:var(--s2);border:1px solid var(--line);border-radius:11px;height:44px;overflow:hidden}
.stepper button{width:44px;height:100%;font-size:22px;color:var(--muted)}.stepper input{flex:1;min-width:0;text-align:center;background:none;border:0;outline:0;font-size:17px;font-weight:700;height:100%}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media(min-width:620px){.tiles{grid-template-columns:repeat(6,1fr)}}
.tile{background:var(--s2);border-radius:12px;padding:10px 6px;text-align:center}.tile b{display:block;font-size:21px;letter-spacing:-.02em}.tile span{font-size:11px;color:var(--muted);font-weight:600}
.tile.hero-t{grid-column:span 1}.hit{color:var(--hit)}.miss{color:var(--miss)}.amber{color:var(--amber)}
canvas{width:100%;height:230px;display:block}
.scroll{overflow-x:auto;margin:0 -16px;padding:0 16px}
table{width:100%;border-collapse:collapse;font-size:14px}th{color:var(--muted);font-weight:600;text-align:left;padding:8px 8px 8px 0;font-size:12px;letter-spacing:.03em;text-transform:uppercase;white-space:nowrap}
td{padding:10px 8px 10px 0;border-top:1px solid var(--line);white-space:nowrap}td.w{white-space:normal}th.sort{cursor:pointer}
tr.hl td{background:#162033}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;background:#222b3a;color:var(--text)}
.pill.out,.pill.suspended{background:rgba(248,113,113,.16);color:#fca5a5}.pill.doubtful{background:rgba(245,184,61,.16);color:#f5c96a}.pill.returning,.pill.likely_start{background:rgba(52,211,153,.14);color:#6ee7b7}
.form{display:inline-flex;gap:3px}.form i{font-style:normal;width:20px;height:20px;border-radius:5px;display:grid;place-items:center;font-size:11px;font-weight:800;background:#222b3a}
.form i.W{background:rgba(52,211,153,.2);color:#6ee7b7}.form i.L{background:rgba(248,113,113,.2);color:#fca5a5}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}.kv dt{color:var(--muted)}.kv dd{margin:0;text-align:right;font-weight:600}
.fx{padding:14px 0;border-top:1px solid var(--line)}.fx:first-child{border-top:0}
.fx summary{list-style:none;cursor:pointer;display:flex;gap:12px;align-items:center}.fx summary::-webkit-details-marker{display:none}
.fx .time{width:46px;flex:none;color:var(--muted);font-weight:700;font-size:14px}.fx .teams{flex:1;min-width:0}.fx .teams b{display:block;font-weight:600}.fx .teams span{font-size:13px;color:var(--muted)}
.fx .more{margin:12px 0 0 58px;display:grid;gap:12px}
.dayh{margin:22px 0 4px;font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.score{font-weight:800;font-variant-numeric:tabular-nums}
.crumb{font-size:14px;margin-bottom:10px;display:inline-block}
.prof{display:flex;gap:14px;align-items:center}.avatar{width:56px;height:56px;border-radius:16px;background:var(--s2);border:1px solid var(--line);display:grid;place-items:center;font-weight:800;font-size:20px;color:var(--accent);flex:none}
.grid2{display:grid;gap:12px}@media(min-width:760px){.grid2{grid-template-columns:1fr 1fr}}
.stack>*+*{margin-top:14px}
footer.site{max-width:980px;margin:34px auto 0;padding:18px max(16px,env(safe-area-inset-left)) 24px;border-top:1px solid var(--line);color:var(--muted);font-size:13px}
footer.site a{color:var(--muted);text-decoration:underline}
