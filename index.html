// Tiny key-value store. Uses the phone/browser's IndexedDB; falls back to memory (used by the tests).

class MemoryStore {
  constructor() { this.m = new Map(); }
  async get(k) { return this.m.has(k) ? structuredClone(this.m.get(k)) : undefined; }
  async set(k, v) { this.m.set(k, structuredClone(v)); }
  async del(k) { this.m.delete(k); }
  async entries(prefix = '') { return [...this.m.entries()].filter(([k]) => k.startsWith(prefix)).map(([k, v]) => [k, structuredClone(v)]); }
  async keys(prefix = '') { return [...this.m.keys()].filter(k => k.startsWith(prefix)); }
  async clear() { this.m.clear(); }
}

class IdbStore {
  constructor(db) { this.db = db; }
  _tx(mode, fn) {
    return new Promise((res, rej) => {
      const t = this.db.transaction('kv', mode); const s = t.objectStore('kv');
      const out = fn(s); t.oncomplete = () => res(out.result !== undefined ? out.result : undefined); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    });
  }
  get(k) { return this._tx('readonly', s => s.get(k)); }
  set(k, v) { return this._tx('readwrite', s => s.put(v, k)); }
  del(k) { return this._tx('readwrite', s => s.delete(k)); }
  clear() { return this._tx('readwrite', s => s.clear()); }
  keys(prefix = '') {
    return new Promise((res, rej) => {
      const out = []; const t = this.db.transaction('kv', 'readonly'); const s = t.objectStore('kv');
      const range = prefix ? IDBKeyRange.bound(prefix, prefix + '￿') : undefined;
      const req = s.openKeyCursor(range);
      req.onsuccess = () => { const c = req.result; if (c) { out.push(c.key); c.continue(); } else res(out); };
      req.onerror = () => rej(req.error);
    });
  }
  entries(prefix = '') {
    return new Promise((res, rej) => {
      const out = []; const t = this.db.transaction('kv', 'readonly'); const s = t.objectStore('kv');
      const range = prefix ? IDBKeyRange.bound(prefix, prefix + '￿') : undefined;
      const req = s.openCursor(range);
      req.onsuccess = () => { const c = req.result; if (c) { out.push([c.key, c.value]); c.continue(); } else res(out); };
      req.onerror = () => rej(req.error);
    });
  }
}

async function openStore() {
  if (typeof indexedDB === 'undefined') return new MemoryStore();
  try {
    const db = await new Promise((res, rej) => {
      const r = indexedDB.open('proplab', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('kv');
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    });
    return new IdbStore(db);
  } catch { return new MemoryStore(); }
}

return { MemoryStore, openStore };

// Football data: API-Football adapter (free plan), parsing, sync, markets, opponent and referee profiles.

const BASE = 'https://v3.football.api-sports.io';

// Add a competition later by adding one line (ids are API-Football league ids).
const LEAGUES = {
  epl: { id: 39, name: 'Premier League' },
  laliga: { id: 140, name: 'La Liga' },
  bundesliga: { id: 78, name: 'Bundesliga' },
  seriea: { id: 135, name: 'Serie A' },
  ligue1: { id: 61, name: 'Ligue 1' },
  mls: { id: 253, name: 'MLS' },
};

class ApiError extends Error {
  constructor(kind, message, detail) { super(message); this.kind = kind; this.detail = detail; }
}

const defaultSeason = (d = new Date()) => (d.getUTCMonth() >= 6 ? d.getUTCFullYear() : d.getUTCFullYear() - 1);

const defaultSleep = ms => new Promise(r => setTimeout(r, ms));

class ApiFootball {
  constructor(key, { fetchImpl, minGapMs = 6200, sleep = defaultSleep, onRequest = () => {} } = {}) {
    this.key = (key || '').trim();
    this.fetch = fetchImpl || (typeof fetch !== 'undefined' ? fetch.bind(globalThis) : null);
    this.minGapMs = minGapMs; this.sleep = sleep; this.onRequest = onRequest;
    this.lastAt = 0; this.used = 0;
  }

  async get(path, params = {}) {
    if (!this.key) throw new ApiError('auth', 'No API key saved yet. Paste your free key in Setup first.');
    const wait = this.lastAt + this.minGapMs - Date.now();
    if (wait > 0) await this.sleep(wait); // free plan allows 10 requests per minute
    this.lastAt = Date.now();
    const url = new URL(BASE + path);
    for (const [k, v] of Object.entries(params)) url.searchParams.set(k, v);
    let res;
    try { res = await this.fetch(url.toString(), { headers: { 'x-apisports-key': this.key } }); }
    catch (e) {
      throw new ApiError('network', 'Could not reach API-Football. Check your internet connection. If other websites work, the provider may be blocking requests made straight from a web page (see the Setup help).', String(e));
    }
    this.used++; this.onRequest();
    if (res.status === 429) throw new ApiError('rate', 'Too many requests too quickly. Wait a minute and try again.');
    if (res.status === 401 || res.status === 403) throw new ApiError('auth', 'API-Football rejected the key. Check it was pasted in full.');
    if (!res.ok) throw new ApiError('http', `API-Football returned an error (HTTP ${res.status}).`);
    let body;
    try { body = await res.json(); } catch { throw new ApiError('http', 'API-Football sent a reply the app could not read.'); }
    const errs = body.errors;
    const hasErrs = errs && (Array.isArray(errs) ? errs.length : Object.keys(errs).length);
    if (hasErrs) {
      const o = Array.isArray(errs) ? { other: errs.join('; ') } : errs;
      const msg = Object.values(o).join('; ');
      if (o.token) throw new ApiError('auth', 'API-Football rejected the key. Check it was pasted in full.', msg);
      if (o.plan) throw new ApiError('plan', `Your free plan does not allow this: ${msg}`, msg);
      if (o.rateLimit) throw new ApiError('rate', 'Too many requests too quickly. Wait a minute and try again.', msg);
      if (o.requests) throw new ApiError('quota', 'You have used today\'s free requests. They reset at midnight UTC (1am UK time in summer, midnight in winter).', msg);
      throw new ApiError('other', `API-Football said: ${msg}`, msg);
    }
    return body;
  }

  async status() {
    const b = await this.get('/status');
    const r = b.response || {};
    return { plan: r.subscription?.plan ?? null, active: r.subscription?.active ?? null, used: r.requests?.current ?? null, limit: r.requests?.limit_day ?? null, email: r.account?.email ?? null };
  }

  /** Which seasons can this key read? One small request per season. */
  async probeSeasons(leagueKey, seasons) {
    const out = [];
    for (const season of seasons) {
      try {
        const b = await this.get('/fixtures', { league: LEAGUES[leagueKey].id, season, last: 1 });
        out.push({ season, ok: true, hasData: (b.response || []).length > 0 });
      } catch (e) {
        if (e.kind === 'plan') out.push({ season, ok: false, message: e.detail || e.message });
        else throw e;
      }
    }
    return out;
  }

  async nextFixture(teamId) {
    const b = await this.get('/fixtures', { team: teamId, next: 1 });
    const f = (b.response || [])[0];
    return f ? { date: f.fixture.date, referee: f.fixture.referee || null, home: f.teams.home, away: f.teams.away, leagueName: f.league?.name } : null;
  }
}

// ---------- parsing ----------

const COUNT_FIELDS = ['shots', 'shots_on_target', 'goals', 'assists', 'tackles', 'interceptions', 'blocks', 'fouls_committed', 'fouls_drawn',
  'yellow_cards', 'red_cards', 'offsides', 'passes', 'key_passes', 'dribbles_attempted', 'dribbles_success', 'duels_total', 'duels_won', 'saves', 'goals_conceded'];
// API-Football sends blank (null) instead of 0. We only turn blanks into zeros when the match clearly has stats.
const PER_FIELD = ['shots', 'shots_on_target', 'tackles', 'interceptions', 'blocks', 'fouls_committed', 'fouls_drawn', 'passes', 'key_passes', 'dribbles_attempted', 'dribbles_success', 'duels_total', 'duels_won'];
const FIXTURE_LEVEL = ['goals', 'assists', 'yellow_cards', 'red_cards', 'offsides', 'goals_conceded'];
const EVIDENCE = ['passes', 'duels_total', 'shots', 'tackles', 'fouls_committed', 'fouls_drawn'];
const MIN_EVIDENCE_ROWS = 10;

function parsePlayerStats(block) {
  const out = [];
  for (const p of block.players || []) {
    const s = (p.statistics || [])[0] || {};
    const g = s.games || {}, sh = s.shots || {}, go = s.goals || {}, pa = s.passes || {}, ta = s.tackles || {}, du = s.duels || {},
      dr = s.dribbles || {}, fo = s.fouls || {}, ca = s.cards || {};
    if (g.minutes === null || g.minutes === undefined) continue; // did not play
    out.push({
      pid: p.player.id, name: p.player.name, minutes: g.minutes, started: g.substitute ? 0 : 1, position: g.position || null,
      shots: sh.total ?? null, shots_on_target: sh.on ?? null, goals: go.total ?? null, assists: go.assists ?? null,
      saves: go.saves ?? null, goals_conceded: go.conceded ?? null,
      tackles: ta.total ?? null, interceptions: ta.interceptions ?? null, blocks: ta.blocks ?? null,
      fouls_committed: fo.committed ?? null, fouls_drawn: fo.drawn ?? null,
      yellow_cards: ca.yellow ?? null, red_cards: ca.red ?? null, offsides: s.offsides ?? null,
      passes: pa.total ?? null, key_passes: pa.key ?? null, dribbles_attempted: dr.attempts ?? null, dribbles_success: dr.success ?? null,
      duels_total: du.total ?? null, duels_won: du.won ?? null,
    });
  }
  return out;
}

/** Turns provider blanks into zeros only where the match has real stats. Returns whether the match is covered. */
function normalizeRows(rows) {
  const evidence = rows.filter(r => EVIDENCE.some(f => r[f] !== null)).length;
  if (evidence < MIN_EVIDENCE_ROWS) return false;
  for (const f of PER_FIELD) {
    if (rows.filter(r => r[f] !== null).length >= 2) for (const r of rows) if (r[f] === null) r[f] = 0;
  }
  for (const f of FIXTURE_LEVEL) for (const r of rows) if (r[f] === null) r[f] = 0;
  for (const r of rows) if (r.saves === null && r.position === 'G') r.saves = 0;
  return true;
}

function buildFixtureRecord(f, blocks, leagueKey, season, fetchedAt = Date.now()) {
  const home = f.teams.home, away = f.teams.away, rows = [];
  for (const b of blocks) {
    const tid = b.team.id;
    for (const r of parsePlayerStats(b)) rows.push({ ...r, tid, oid: tid === home.id ? away.id : home.id, home: tid === home.id ? 1 : 0 });
  }
  const covered = normalizeRows(rows);
  const ref = f.fixture.referee ? String(f.fixture.referee).split(',')[0].trim() : null;
  return {
    id: f.fixture.id, league: leagueKey, season, date: f.fixture.date, referee: ref, covered,
    home: { id: home.id, name: home.name }, away: { id: away.id, name: away.name },
    score: { home: f.goals?.home ?? null, away: f.goals?.away ?? null }, rows, fetchedAt,
  };
}

// ---------- sync ----------

const fxKey = (league, season, id) => `fx:${league}:${season}:${id}`;

async function syncLeague({ api, store, leagueKey, season, maxRequests = 40, onProgress = () => {}, shouldStop = () => false, now = () => Date.now(), listMaxAgeMs = 12 * 3600e3 }) {
  const L = LEAGUES[leagueKey];
  const listKey = `fxlist:${leagueKey}:${season}`;
  let spent = 0, stoppedReason = null, error = null, added = 0, noData = 0;
  let list = await store.get(listKey);
  if (!list || now() - list.fetchedAt > listMaxAgeMs) {
    const b = await api.get('/fixtures', { league: L.id, season, status: 'FT' });
    spent++;
    list = { fetchedAt: now(), fixtures: (b.response || []).map(f => ({ fixture: { id: f.fixture.id, date: f.fixture.date, referee: f.fixture.referee || null }, teams: { home: { id: f.teams.home.id, name: f.teams.home.name }, away: { id: f.teams.away.id, name: f.teams.away.name } }, goals: f.goals })) };
    await store.set(listKey, list);
  }
  const have = new Set((await store.keys(`fx:${leagueKey}:${season}:`)).map(k => Number(k.split(':')[3])));
  const pending = list.fixtures.filter(f => !have.has(f.fixture.id)).sort((a, b) => (a.fixture.date < b.fixture.date ? 1 : -1));
  onProgress({ phase: 'start', total: pending.length, spent });
  for (const f of pending) {
    if (spent >= maxRequests) { stoppedReason = 'request budget reached'; break; }
    if (shouldStop()) { stoppedReason = 'stopped by you'; break; }
    try {
      const b = await api.get('/fixtures/players', { fixture: f.fixture.id });
      spent++;
      const rec = buildFixtureRecord(f, b.response || [], leagueKey, season, now());
      if (!rec.rows.length) noData++;
      await store.set(fxKey(leagueKey, season, f.fixture.id), rec);
      added++;
      onProgress({ phase: 'fixture', added, total: pending.length, spent, date: f.fixture.date });
    } catch (e) {
      if (['rate', 'quota', 'auth', 'plan', 'network'].includes(e.kind)) { stoppedReason = e.message; error = e.kind; break; }
      error = e.kind; spent++; // odd single-match error: skip it, carry on
    }
  }
  await store.set(`synced:${leagueKey}:${season}`, { at: now(), listSize: list.fixtures.length });
  return { leagueKey, season, listSize: list.fixtures.length, alreadyStored: have.size, added, noData, remaining: pending.length - added, spent, stoppedReason, error, complete: pending.length - added === 0 };
}

async function loadFixtures(store) {
  return (await store.entries('fx:')).map(([, v]) => v);
}

// ---------- index ----------

function buildIndex(fixtures) {
  const teams = new Map();
  for (const f of fixtures) { teams.set(String(f.home.id), f.home); teams.set(String(f.away.id), f.away); }
  const players = new Map();
  const sorted = [...fixtures].sort((a, b) => (a.date < b.date ? 1 : -1)); // newest first
  for (const f of sorted) {
    for (const r of f.rows) {
      let p = players.get(String(r.pid));
      if (!p) { p = { id: r.pid, key: 'fb:' + r.pid, name: r.name, teamId: r.tid, team: teams.get(String(r.tid))?.name || '?', position: r.position, league: f.league, rows: [] }; players.set(String(r.pid), p); }
      p.rows.push({ ...r, fid: f.id, date: f.date, season: f.season, league: f.league, opp: teams.get(String(r.oid))?.name || '?', referee: f.referee, covered: f.covered });
    }
  }
  return { players, teams, fixtures: sorted };
}

// ---------- markets ----------

const add = (a, b) => (a === null && b === null ? null : (a || 0) + (b || 0));
const FOOTBALL_MARKETS = [
  { key: 'tackles', label: 'Tackles', group: 'Priority', get: r => r.tackles },
  { key: 'fouls_committed', label: 'Fouls committed', group: 'Priority', get: r => r.fouls_committed },
  { key: 'fouls_drawn', label: 'Fouls drawn', group: 'Priority', get: r => r.fouls_drawn },
  { key: 'shots', label: 'Total shots', group: 'Priority', get: r => r.shots },
  { key: 'shots_on_target', label: 'Shots on target', group: 'Priority', get: r => r.shots_on_target },
  { key: 'goals', label: 'Goals (anytime scorer = over 0.5)', group: 'Priority', get: r => r.goals },
  { key: 'assists', label: 'Assists', group: 'Priority', get: r => r.assists },
  { key: 'cards_total', label: 'Cards (yellow + red)', group: 'Priority', get: r => add(r.yellow_cards, r.red_cards) },
  { key: 'yellow_cards', label: 'Yellow cards', group: 'Priority', get: r => r.yellow_cards },
  { key: 'goal_contrib', label: 'Goal contributions (goals + assists)', group: 'More', get: r => add(r.goals, r.assists) },
  { key: 'offsides', label: 'Offsides', group: 'More', get: r => r.offsides },
  { key: 'interceptions', label: 'Interceptions', group: 'More', get: r => r.interceptions },
  { key: 'blocks', label: 'Blocks', group: 'More', get: r => r.blocks },
  { key: 'duels_won', label: 'Duels won', group: 'More', get: r => r.duels_won },
  { key: 'passes', label: 'Passes attempted', group: 'More', get: r => r.passes },
  { key: 'key_passes', label: 'Key passes', group: 'More', get: r => r.key_passes },
  { key: 'dribbles_attempted', label: 'Dribbles attempted', group: 'More', get: r => r.dribbles_attempted },
  { key: 'dribbles_success', label: 'Successful dribbles', group: 'More', get: r => r.dribbles_success },
  { key: 'saves', label: 'Goalkeeper saves', group: 'Goalkeeper', positions: ['G'], get: r => r.saves },
  { key: 'goals_conceded', label: 'Goals conceded (goalkeeper)', group: 'Goalkeeper', positions: ['G'], get: r => r.goals_conceded },
