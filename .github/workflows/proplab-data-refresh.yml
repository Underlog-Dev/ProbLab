# PropLab daily data refresh. Create this file in the repository as:  .github/workflows/proplab-data-refresh.yml
# It needs _proplab-refresh.zip (the refresh tools) in the top folder of the repository.
# Runs seven times a day (about 06:07, 12:07, 14:37, 17:07, 18:37, 20:07 and 23:02 UK time; GitHub's timezone setting handles GMT/BST).
# GitHub may start scheduled runs late, so these are intended starts, not guarantees. A catch-up run at 23:47 only does work if
# nothing has succeeded since 22:30. Squad lists (Wikipedia) are read at most every 10 hours.
# Only data-*.json files are ever committed; the site's code is never changed by this workflow.
name: PropLab data refresh
on:
  schedule:
    # 5 Nov 2026 (owner): six refreshes a day, a few minutes after the hour (GitHub is busiest exactly on the hour and may start late),
    # plus a 23:47 catch-up that only does work if the 23:02 run did not succeed.
    - cron: '7 6 * * *'
      timezone: 'Europe/London'
    - cron: '7 12 * * *'
      timezone: 'Europe/London'
    - cron: '37 14 * * *'
      timezone: 'Europe/London'
    - cron: '7 17 * * *'
      timezone: 'Europe/London'
    # 9 Nov 2026 (owner): the NBA source (sportsdataverse) publishes the previous night's games around 17:00-17:30 UK time; this run
    # picks them up before the evening's games instead of waiting for 20:07.
    - cron: '37 18 * * *'
      timezone: 'Europe/London'
    - cron: '7 20 * * *'
      timezone: 'Europe/London'
    - cron: '2 23 * * *'
      timezone: 'Europe/London'
    - cron: '47 23 * * *'
      timezone: 'Europe/London'
  workflow_dispatch:
    inputs:
      force:
        description: 'Run even if tonight''s refresh already succeeded'
        type: boolean
        default: true
permissions:
  contents: write
  pages: write
concurrency:
  group: proplab-data-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unpack the refresh tools
        run: unzip -q -o _proplab-refresh.zip -d "$RUNNER_TEMP/proplab-tools"
      # 9 Nov 2026: downloads are kept between runs. Completed-season files are reused for up to 7 days, and when a source is down
      # (e.g. HTTP 504 from nflverse / sportsdataverse) the last good copy is used, so NFL and NBA still rebuild. Never published itself.
      - name: Restore the download cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/proplab-cache
          key: proplab-dl-${{ github.run_id }}
          restore-keys: proplab-dl-
      - name: Refresh, validate and commit data
        id: refresh
        env:
          FORCE: ${{ inputs.force || 'false' }}
          PROPLAB_SCHEDULE: ${{ github.event.schedule }}
          PROPLAB_CACHE: ${{ runner.temp }}/proplab-cache
        run: bash "$RUNNER_TEMP/proplab-tools/owner-tools/ci-refresh.sh" "$RUNNER_TEMP/proplab-tools"
      - name: Save the download cache (also after a failed run, so good downloads are kept)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/proplab-cache
          key: proplab-dl-${{ github.run_id }}
      - name: Publish the site (GitHub Pages does not rebuild for commits made by workflows)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" --silent || echo "::warning::Could not request a GitHub Pages build; the new data appears with the next upload."
